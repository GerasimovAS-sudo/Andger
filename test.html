<!DOCTYPE html>
<html>
<head>
<style>
  body { background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="350" height="350">
  <defs>
    <!-- Фон иконки -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141024"/><stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
    
    <!-- 3 Градиента для сегментов диаграммы -->
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e5cff"/><stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#d94aff"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d94aff"/><stop offset="100%" stop-color="#ffc233"/>
    </linearGradient>
    
    <!-- Единый градиент для буквы -->
    <linearGradient id="gradA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e5cff"/><stop offset="50%" stop-color="#d94aff"/><stop offset="100%" stop-color="#ffc233"/>
    </linearGradient>

    <!-- Тени для 3D-объема -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Темный квадрат iOS -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- ДИАГРАММА (3 СЕГМЕНТА) -->
  <g filter="url(#shadow)">
    <!-- Сегмент 1: Верх-право (Синий -> Фиолетовый) -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad1)" stroke-width="38" stroke-linecap="round" stroke-dasharray="230 775" stroke-dashoffset="0" transform="rotate(-90 256 256)"/>
    
    <!-- Сегмент 2: Низ-право (Фиолетовый -> Розовый) -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad2)" stroke-width="38" stroke-linecap="round" stroke-dasharray="230 775" stroke-dashoffset="-245" transform="rotate(-90 256 256)"/>
    
    <!-- Сегмент 3: Левая половина (Розовый -> Оранжевый) -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad3)" stroke-width="38" stroke-linecap="round" stroke-dasharray="475 530" stroke-dashoffset="-490" transform="rotate(-90 256 256)"/>
  </g>

  <!-- БУКВА А (Идеальный премиум-шрифт с градиентом) -->
  <g transform="translate(256, 265)" filter="url(#textShadow)">
    <!-- Ножки и плоская верхушка -->
    <path d="M -55 60 L -10 -50 L 10 -50 L 55 60" fill="none" stroke="url(#gradA)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Перекладина -->
    <line x1="-35" y1="5" x2="35" y2="5" stroke="url(#gradA)" stroke-width="42" stroke-linecap="round"/>
  </g>

</svg>

</body>
</html>
