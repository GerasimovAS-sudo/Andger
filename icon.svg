<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff9a56"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a56" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="180" height="180" rx="42" fill="#0d0a18"/>
  <circle cx="90" cy="90" r="62" fill="url(#glow)"/>
  <circle cx="90" cy="90" r="52" fill="none" stroke="#1a1428" stroke-width="12"/>
  <circle cx="90" cy="90" r="52" fill="none" stroke="url(#ring)" stroke-width="14"
    stroke-linecap="round" stroke-dasharray="326" stroke-dashoffset="98"
    transform="rotate(-90 90 90)" opacity="0.35" filter="url(#soft)"/>
  <circle cx="90" cy="90" r="52" fill="none" stroke="url(#ring)" stroke-width="12"
    stroke-linecap="round" stroke-dasharray="326" stroke-dashoffset="98"
    transform="rotate(-90 90 90)"/>
</svg>